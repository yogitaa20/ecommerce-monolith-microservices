
services:
  product-service:
    build: ./product-service
    container_name: shopnest-product-service
    ports:
      - "3001:3001"
    networks:
      - shopnest-network
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: shopnest-order-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATA_DIR: /data
    volumes:
      - order-data:/data
    networks:
      - shopnest-network
    restart: unless-stopped

  storefront:
    image: nginx:alpine
    container_name: shopnest-storefront
    ports:
      - "8081:80"
    volumes:
      - ./storefront:/usr/share/nginx/html:ro
    depends_on:
      - product-service
      - order-service
    networks:
      - shopnest-network
    restart: unless-stopped

networks:
  shopnest-network:
    driver: bridge

volumes:
  order-data:
